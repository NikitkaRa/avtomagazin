<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Автомагазин" />
    <title>Автомагазин</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/lib/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/app.css" />
</head>
<body>
    <div class="app">
        <header class="topbar">
            <a class="brand" href="#/">Автомагазин</a>
            <nav class="top-nav">
                <a href="#/" data-nav="/">Карта</a>
                <a href="#/schedule" data-nav="/schedule">Расписание</a>
                <a href="#/favorites" data-nav="/favorites">Избранное</a>
            </nav>
        </header>

        <div id="status-banner" class="status-banner" hidden></div>

        <main>
            <section data-page="/" hidden>
                <section class="hero">
                    <p class="eyebrow">Для жителей деревни</p>
                    <h1>Когда приедет автолавка</h1>
                    <p class="sub" id="sync-hint"></p>
                </section>
                <div class="row">
                    <button class="btn btn-ghost" id="nearest-btn" type="button">Ближайшая остановка</button>
                </div>
                <p class="tiny muted" id="nearest-hint"></p>
                <div class="chips" id="settlement-chips"></div>
                <div class="map map-tall" id="resident-map"></div>
                <p class="tiny muted" id="map-hint"></p>
                <div id="eta-list"></div>
            </section>

            <section data-page="/schedule" hidden>
                <section class="hero">
                    <h1>Расписание</h1>
                    <p class="sub">Нажмите остановку — избранное и отметка «на месте».</p>
                </section>
                <div id="schedule-list"></div>
            </section>

            <section data-page="/favorites" hidden>
                <section class="hero">
                    <h1>Избранное</h1>
                    <p class="sub">Пуш придёт, когда водитель нажмёт «На месте» у этой остановки.</p>
                </section>
                <div id="favorites-list"></div>
                <button class="btn btn-ghost" id="install-btn" type="button" hidden>Добавить на экран</button>
            </section>

            <section data-page="/stop" hidden>
                <p><a class="back" href="#/">← к карте</a></p>
                <div id="stop-detail"></div>
            </section>
        </main>
    </div>
    <script src="/lib/leaflet/leaflet.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
